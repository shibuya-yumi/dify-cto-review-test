name: Dify CTO Review Bot

# PRのラベル追加イベントをトリガーに設定
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  dify-cto-review:
    # cto-reviewラベルが追加された場合のみ実行
    if: github.event.label.name == 'cto-review'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check Webhook Server Health
        env:
          WEBHOOK_SERVER_URL: "http://10.134.131.142/webhook"
        run: |
          chmod +x ./scripts/check-webhook-server.sh
          ./scripts/check-webhook-server.sh

      - name: Call Webhook Server
        env:
          WEBHOOK_SERVER_URL: "http://10.134.131.142/webhook"
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          echo "::group::Webhookサーバーにリクエスト送信"
          chmod +x ./scripts/call-webhook-server.sh
          ./scripts/call-webhook-server.sh
          echo "::endgroup::"
